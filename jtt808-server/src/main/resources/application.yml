spring:
  application:
    name: jt808
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
      date: yyyy-MM-dd
      time: HH:mm:ss
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  configuration:
    use-generated-keys: true
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations:
    - classpath:/mapper/*.xml

springdoc:
  swagger-ui:
    defaultModelsExpandDepth: -1
    default-model-expand-depth: 1

server:
  port: 8100

jt-server:
  jt808:
    tcp-port: 7100
    udp-port: 7100
    idle-timeout: 180
    message-package: org.yzh.protocol
    t0801:
      path: D:/jt_data/media_file
    t9208:
      host: 127.0.0.1
      port: 7200
      enabled: false
      path: D:/jt_data/alarm_file
    t9206:
      host: 127.0.0.1
      port: 21
      username: test
      password: test
    video360:
      channels:
        panorama: 240
        panorama-any: 241
        panorama-rear: 242
        panorama-front: 243
        panorama-left: 244
        panorama-right: 245
        keep-rotation: 246
